add_alarm:
  fields:
    device_id:
      selector:
        device:
          integration: hassmic
    time:
      required: true
      example: "07:30:00"
      selector:
        time:
    days:
      example: '["mon", "tue", "wed", "thu", "fri"]'
      selector:
        select:
          multiple: true
          options: [mon, tue, wed, thu, fri, sat, sun]
    label:
      selector:
        text:
    enabled:
      default: true
      selector:
        boolean:
edit_alarm:
  target:
    entity:
      integration: hassmic
      domain: switch
  fields:
    time:
      selector:
        time:
    days:
      selector:
        select:
          multiple: true
          options: [mon, tue, wed, thu, fri, sat, sun]
    label:
      selector:
        text:
    enabled:
      selector:
        boolean:
delete_alarm:
  target:
    entity:
      integration: hassmic
      domain: switch
snooze:
  fields:
    device_id:
      selector:
        device:
          integration: hassmic
stop:
  fields:
    device_id:
      selector:
        device:
          integration: hassmic

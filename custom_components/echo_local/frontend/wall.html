<!doctype html>
<!-- Echo Local's wall panel (wall.js): Home Assistant as a grid of glass widgets over a wallpaper, in the manner of Apple's
     HomeView, for the Echo Show's kiosk (src/hassmic/kiosk.c) and any wall tablet: a Home page (clock, date and weather,
     thermostat, what plays, scenes, locks, the lights that are on), then a page per room; swiped sideways.  Left alone,
     the ambient clock.  A page of its own on Home Assistant's websocket, not a dashboard: Home Assistant's frontend
     takes 150-250 MB in Chromium, this a small part of that, and the Show 5 has 1 GB for everything. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Wall panel</title>
<style>
:root {
  /* the wallpaper: amber by default (?theme=amber|dusk|light), drawn once with gradients (no blur filters: the Show's GPU) */
  --wall: radial-gradient(70% 90% at 75% 35%, rgba(255, 214, 140, .55), transparent 60%),
          radial-gradient(60% 80% at 20% 90%, rgba(150, 70, 10, .55), transparent 65%),
          linear-gradient(135deg, #b8601c 0%, #d98a33 45%, #e9a74b 70%, #c46f22 100%);
  --glass: rgba(255, 255, 255, .17);
  --glass-edge: rgba(255, 255, 255, .28);
  --glass-on: rgba(255, 250, 240, .86);
  --text: #fff;
  --text-dim: rgba(255, 255, 255, .72);
  --text-on: #2b2118;
  --text-on-dim: rgba(43, 33, 24, .6);
  --sheet: rgba(60, 38, 18, .96);
  /* what is on, by kind (wall.js look()): its icon in this on a lit tile */
  --amber: #f29a12; --green: #2fb350; --blue: #3d8bf2; --orange: #ef6c2a; --red: #e5484d; --purple: #8b6cf0;
  --gap: 10px;
  --pad: 12px;
  --cell: 140px;
  --u: calc(var(--cell) / 100);
  --U: calc((var(--cell) * 2 + var(--gap)) / 100);
  --cols: 6;
  --rows: 3;
}
:root[data-theme=dusk] {
  --wall: radial-gradient(70% 90% at 80% 20%, rgba(120, 140, 255, .45), transparent 60%),
          radial-gradient(60% 80% at 10% 100%, rgba(190, 80, 160, .45), transparent 65%),
          linear-gradient(135deg, #1d2140 0%, #34306a 50%, #1a1d38 100%);
  --glass-on: rgba(236, 232, 255, .88); --text-on: #221d3a; --text-on-dim: rgba(34, 29, 58, .6); --sheet: rgba(30, 28, 56, .97);
}
:root[data-theme=light] {
  --wall: linear-gradient(160deg, #f4f3f8 0%, #e7e5ee 100%);
  --glass: rgba(255, 255, 255, .7); --glass-edge: rgba(0, 0, 0, .06); --glass-on: #d9d2f7;
  --text: #2a2833; --text-dim: rgba(42, 40, 51, .55); --text-on: #3c2f86; --text-on-dim: rgba(60, 47, 134, .65); --sheet: #fbfaff;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { background: #000; color: var(--text); user-select: none; -webkit-user-select: none;
       font: 14px/1.2 -apple-system, "SF Pro Text", "Amazon Ember", Roboto, "Segoe UI", sans-serif; }
#wall { position: fixed; inset: 0; background: var(--wall); }
#pages { position: fixed; inset: 0; display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none; }
#pages::-webkit-scrollbar { display: none; }
.page { flex: none; width: 100vw; height: 100%; scroll-snap-align: start; padding: var(--pad); padding-bottom: 22px;
        display: grid; gap: var(--gap); grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); grid-template-rows: repeat(var(--rows), minmax(0, 1fr)); grid-auto-flow: dense; }
/* the dots: which page; held 0.7 s, the edit mode */
#dots { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; height: 22px; padding: 0 14px; display: flex; justify-content: center; align-items: center; gap: 6px; font-size: 11px; color: var(--text-dim); touch-action: none; }
#dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--text-dim); opacity: .45; }
#dots i.sel { opacity: 1; }
#dots span { margin-right: 4px; font-weight: 600; }

/* a widget: square glass; 2x2 the big ones */
/* sizes in --u, a hundredth of a cell (wall.js grid() sets --cell), so a tile reads the same on a Show 5's 140 px
   cells and a tablet's larger ones; a 2x2 widget's in --U, a hundredth of its own height */
.w { position: relative; border-radius: calc(19 * var(--u)); background: var(--glass); box-shadow: inset 0 0 0 1px var(--glass-edge), 0 6px 18px rgba(0,0,0,.08);
     overflow: hidden; min-width: 0; min-height: 0; color: var(--text); transition: background .2s, transform .12s; }
.w.big { grid-column: span 2; grid-row: span 2; border-radius: calc(10 * var(--U)); }
.w.wide { grid-column: span 2; }
.w:active { transform: scale(.97); }
.tile { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: calc(6 * var(--u)) calc(6 * var(--u)); gap: calc(1 * var(--u)); cursor: pointer; }
.tile .ic { width: calc(25 * var(--u)); height: calc(25 * var(--u)); margin-bottom: calc(7 * var(--u)); color: var(--text); flex: none; }
.tile .ic svg { width: 100%; height: 100%; }
.tile .nm { font-weight: 700; font-size: max(11px, calc(10.5 * var(--u))); max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .st { font-size: max(10px, calc(9.2 * var(--u))); color: var(--text-dim); max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile.on { background: var(--glass-on); color: var(--text-on); }
.tile.on .ic { color: var(--c, var(--text-on)); }
.tile.on .st { color: var(--text-on-dim); }
.tile.unavail { opacity: .5; }
.tile .lvl { position: absolute; left: calc(16 * var(--u)); right: calc(16 * var(--u)); bottom: calc(7 * var(--u)); height: 3px; border-radius: 2px; background: rgba(0,0,0,.08); overflow: hidden; }
.tile .lvl b { display: block; height: 100%; background: var(--c, #f5a623); }

/* clock, date and weather */
.clockw svg { width: 100%; height: 100%; display: block; }
.clockw { padding: calc(6 * var(--u)); }
.datew { padding: calc(10 * var(--u)) calc(11 * var(--u)); display: flex; flex-direction: column; justify-content: space-between; }
.datew .day { font-size: max(11px, calc(10.5 * var(--u))); font-weight: 700; color: #ffe2b0; }
:root[data-theme=light] .datew .day { color: #e0533d; }
.datew .num { font-size: calc(32 * var(--u)); font-weight: 300; line-height: .95; }
.datew .wx { display: flex; align-items: center; gap: calc(4 * var(--u)); font-size: calc(15 * var(--u)); font-weight: 500; }
.datew .wx svg { width: calc(16 * var(--u)); height: calc(16 * var(--u)); }
.datew .cond { font-size: max(10px, calc(8.5 * var(--u))); color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* the thermostat: the big number */
.thermo { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: calc(4 * var(--U)) calc(4 * var(--U)) calc(14 * var(--U)); }
.thermo .t { font-size: calc(44 * var(--U)); font-weight: 400; letter-spacing: calc(-1.5 * var(--U)); line-height: 1; font-variant-numeric: tabular-nums; }
.thermo .t small { font-size: calc(16 * var(--U)); letter-spacing: 0; vertical-align: top; }
.thermo .lb { font-weight: 700; font-size: max(11px, calc(5.4 * var(--U))); margin-top: calc(3 * var(--U)); }
.thermo .sub { font-size: max(10px, calc(4.8 * var(--U))); color: var(--text-dim); }
.thermo button:not(.badge) { position: absolute; bottom: calc(3 * var(--U)); width: calc(22 * var(--U)); height: calc(22 * var(--U)); border: 0; background: transparent; color: var(--text); }
.thermo .dn { left: calc(3 * var(--U)); } .thermo .up { right: calc(3 * var(--U)); }
.thermo button:not(.badge) svg { width: calc(12 * var(--U)); height: calc(12 * var(--U)); }

/* what plays */
.np { background-size: cover; background-position: center; display: flex; flex-direction: column; justify-content: flex-end; padding: calc(6 * var(--U)) calc(7 * var(--U)); }
.np::before { content: ""; position: absolute; inset: 0; background: linear-gradient(transparent 30%, rgba(0,0,0,.65)); }
.np > * { position: relative; }
.np .ti { font-size: calc(8 * var(--U)); font-weight: 800; color: #fff; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.np .ar { font-size: max(10px, calc(5.4 * var(--U))); color: rgba(255,255,255,.75); margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.np .ctl { display: flex; justify-content: space-around; align-items: center; }
.np .ctl button { border: 0; background: transparent; color: #fff; width: 48px; height: 40px; }
.np .ctl button svg { width: 26px; height: 26px; }
.np .ctl .pp svg { width: 34px; height: 34px; }

.cam { background: #222 center / cover no-repeat; }
.cam .lb { position: absolute; left: 10px; bottom: 8px; font-size: 12px; font-weight: 700; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.6); }

.msg { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 40px; color: var(--text); font-size: 16px; }
.msg div { max-width: 520px; } .msg b { display: block; font-size: 22px; margin-bottom: 8px; }

/* the ambient clock: big glass digits over the wallpaper */
#ambient { position: fixed; inset: 0; background: var(--wall); display: none; align-items: center; justify-content: center; z-index: 20; }
#ambient.show { display: flex; }
#ambient .digits { font-size: 82vh; font-weight: 600; letter-spacing: -2vh; line-height: 1; color: rgba(255,255,255,.2);
                   -webkit-text-stroke: 2px rgba(255,255,255,.45); text-shadow: 0 2px 30px rgba(255,255,255,.25); font-variant-numeric: tabular-nums;
                   font-family: "SF Pro Display", "Amazon Ember", Roboto, sans-serif; }
#ambient .under { position: absolute; left: 0; right: 0; bottom: 18px; text-align: center; font-size: 18px; font-weight: 600; color: rgba(255,255,255,.85); }

/* editing: the tiles wobble, a star puts one on Home, a minus hides it, a drag moves it */
@keyframes wobble { from { rotate: -.7deg; } to { rotate: .7deg; } }
.editing .w[data-id] { animation: wobble .28s ease-in-out infinite alternate; touch-action: none; }
.editing .w[data-id]:nth-child(2n) { animation-delay: -.14s; }
.w.dragging { animation: none !important; z-index: 6; opacity: .9; box-shadow: 0 14px 34px rgba(0,0,0,.3); pointer-events: none; transition: none; }
.badge { position: absolute; top: 6px; width: 28px; height: 28px; border-radius: 50%; border: 0; display: grid; place-items: center;
         font: 700 17px/1 sans-serif; z-index: 3; box-shadow: 0 2px 6px rgba(0,0,0,.25); padding: 0; }
.badge.fav { left: 6px; background: #fff; color: #f5a623; }
.badge.fav.off { color: #b8b8b8; }
.badge.hide { right: 6px; background: #ff453a; color: #fff; }
#editbar { position: fixed; top: 8px; left: 50%; transform: translateX(-50%); z-index: 8; display: flex; gap: 8px; align-items: center;
           padding: 6px 8px; border-radius: 999px; background: rgba(28, 28, 30, .88); box-shadow: 0 8px 24px rgba(0,0,0,.3); }
#editbar .eb { border: 0; border-radius: 999px; padding: 8px 14px; font: 600 14px/1 sans-serif; background: rgba(255,255,255,.14); color: #fff; }
#editbar .done { background: #fff; color: #1c1c1e; }
#editbar .note { color: rgba(255,255,255,.6); font-size: 12px; padding-right: 6px; }
.swatch { width: 30px; height: 30px; border-radius: 50%; border: 2px solid transparent; padding: 0; }
.swatch.sel { border-color: #fff; }
.swatch.amber { background: linear-gradient(135deg, #b8601c, #e9a74b); }
.swatch.dusk { background: linear-gradient(135deg, #1d2140, #6a4bb0); }
.swatch.light { background: linear-gradient(135deg, #f4f3f8, #d9d2f7); }
.editing #pages .page { padding-top: 56px; }
.toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(28,28,30,.92); color: #fff; padding: 10px 16px; border-radius: 14px; z-index: 30; font-size: 14px; }

/* a long press: the controls */
.veil { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: grid; place-items: center; z-index: 10; }
.sheet { width: min(480px, 94vw); max-height: 94vh; overflow: auto; border-radius: 30px; background: var(--sheet); color: var(--text); padding: 18px 22px 20px; box-shadow: 0 20px 60px rgba(0,0,0,.45); }
:root[data-theme=light] .sheet { color: #2a2833; }
.sheet h3 { margin: 0 0 2px; font-size: 20px; }
.sheet .sub { opacity: .65; font-size: 14px; margin-bottom: 14px; }
.sheet .row { display: flex; gap: 18px; align-items: center; justify-content: center; }
.pill { position: relative; width: 104px; height: 240px; border-radius: 32px; background: rgba(255,255,255,.18); overflow: hidden; touch-action: none; flex: none; }
.pill .fill { position: absolute; left: 0; right: 0; bottom: 0; background: var(--c, #fff); }
.pill .val { position: absolute; left: 0; right: 0; top: 12px; text-align: center; font-weight: 700; color: #fff; mix-blend-mode: difference; }
.btns { display: flex; flex-direction: column; gap: 10px; }
.btn { border: 0; border-radius: 16px; padding: 12px 18px; font: inherit; font-weight: 600; background: rgba(255,255,255,.14); color: inherit; min-width: 120px; }
.btn.primary { background: var(--glass-on); color: var(--text-on); }
.btn svg { width: 22px; height: 22px; vertical-align: middle; }
.temp { font-size: 54px; font-weight: 300; text-align: center; font-variant-numeric: tabular-nums; }
.round { width: 64px; height: 64px; border-radius: 50%; border: 0; background: rgba(255,255,255,.14); color: inherit; font-size: 30px; }
</style>
</head>
<body>
<div id="wall"></div>
<div id="pages"></div>
<div id="dots"></div>
<div id="ambient"><div class="digits" id="adigits"></div><div class="under" id="aunder"></div></div>
<script src="/echo_local/wall.js"></script>
</body>
</html>
